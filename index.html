<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海淀博弈</title>
    <style>
        /* ==========================================================================
           1. 基础布局与全局样式优化（全面提升亮度和手机端清晰度）
           ========================================================================== */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #12141d; /* 稍微提亮底色，防止手机死黑 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            margin: auto;
            background-color: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            aspect-ratio: 16 / 9;
            top: 50%;
            transform: translateY(-50%);
        }

        @media (max-aspect-ratio: 16/9) {
            #game-container {
                width: 100%;
                height: auto;
            }
        }
        @media (min-aspect-ratio: 16/9) {
            #game-container {
                height: 100%;
                width: auto;
            }
        }

        /* ==========================================================================
           2. 画面滤镜与环境效果优化（彻底解决手机看不清的问题）
           ========================================================================== */
        #scene-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: filter 0.8s ease, background-image 0.5s ease;
            z-index: 1;
        }

        /* 统一拉高环境滤镜的整体亮度和对比度 */
        .weather-normal {
            filter: brightness(1.3) contrast(1.05) saturate(1.05);
        }
        
        .weather-sunset {
            filter: sepia(0.3) saturate(1.3) hue-rotate(-10deg) brightness(1.05);
        }
        
        .weather-rain {
            filter: grayscale(0.3) brightness(0.95) contrast(1.1);
        }
        
        .weather-glitch {
            animation: glitchEffect 0.08s infinite;
            filter: contrast(1.3) saturate(1.3) brightness(1.2);
        }

        @keyframes glitchEffect {
            0% { transform: translate(0, 0) skewX(0deg); }
            20% { transform: translate(-2px, 2px) skewX(1deg); }
            40% { transform: translate(1px, -1px) skewX(-1deg); }
            60% { transform: translate(-1px, 1px) skewX(0deg); }
            80% { transform: translate(2px, -2px) skewX(2deg); }
            100% { transform: translate(0, 0) skewX(0deg); }
        }

        /* 3. CRT老旧电视效果大幅度削弱暗角，保证清晰度 */
        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* 提亮暗角渐变，从纯黑改为极高透明度的灰黑 */
            background: radial-gradient(circle, transparent 65%, rgba(0,0,0,0.3) 100%),
                        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.04) 50%);
            background-size: 100% 100%, 100% 4px;
            z-index: 10;
        }

        /* ==========================================================================
           4. 游戏UI、立绘与对话框（保持原逻辑，优化触控体验）
           ========================================================================== */
        #character-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            padding-bottom: 140px;
        }

        .character-sprite {
            height: 85%;
            max-width: 45%;
            object-fit: contain;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.4s ease, transform 0.4s ease, filter 0.3s ease;
            filter: brightness(1.1); /* 立绘单独提亮，更突出 */
        }

        .character-sprite.active {
            opacity: 1;
            transform: translateY(0);
        }

        .character-sprite.focus {
            filter: brightness(1.25) contrast(1.05);
            transform: scale(1.02);
            z-index: 3;
        }

        .character-sprite.blur {
            filter: brightness(0.8) blur(1px);
            z-index: 2;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        #dialogue-box {
            width: 94%;
            height: 130px;
            margin: 0 auto 20px auto;
            background: rgba(10, 12, 22, 0.85);
            border: 1px solid #00ffcc;
            border-radius: 6px;
            padding: 15px 25px;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            position: relative;
        }

        #speaker-name {
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        #dialogue-text {
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 0.5px;
            color: #e0e8f0;
        }

        #click-prompt {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 12px;
            color: #00ffcc;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        #branch-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 6;
            display: none;
        }

        .branch-button {
            width: 100%;
            padding: 14px;
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid #ff0055;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }

        .branch-button:hover, .branch-button:active {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            transform: scale(1.01);
        }

        /* ==========================================================================
           5. 游戏主菜单与封面
           ========================================================================== */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f111a 0%, #050608 100%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #game-title {
            font-size: 48px;
            color: #00ffcc;
            letter-spacing: 8px;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            font-weight: 800;
        }

        .menu-btn {
            padding: 12px 40px;
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }

        .menu-btn:hover, .menu-btn:active {
            background: #00ffcc;
            color: #0c0d12;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="scene-background" class="weather-normal"></div>
        
        <div id="character-stage">
            <img id="sprite-left" class="character-sprite" src="" alt="左侧角色">
            <img id="sprite-right" class="character-sprite" src="" alt="右侧角色">
        </div>

        <div id="ui-layer">
            <div id="branch-container"></div>
            <div id="dialogue-box">
                <div id="speaker-name"></div>
                <div id="dialogue-text"></div>
                <div id="click-prompt">▼ 点击继续</div>
            </div>
        </div>

        <div id="crt-overlay"></div>

        <div id="main-menu">
            <h1 id="game-title">海淀博弈</h1>
            <button class="menu-btn" id="start-btn">▶ START LINK</button>
        </div>
    </div>

    <script>
        // 游戏脚本配置：支持背景、立绘、天气、音效及分支
        const gameScript = [
            {
                id: 0,
                bg: "images/bg_grass.jpg",
                weather: "weather-normal",
                speaker: "系统提示",
                text: "游戏载入成功。当前区域：海淀某高科学院地下模拟场。",
                bgm: "audio/bgm_normal.mp3"
            },
            {
                id: 1,
                speaker: "贾子傲",
                leftSprite: "images/char_jia.png",
                leftStatus: "focus",
                text: "陈梓彤，这次的数据分析结果出来了。正如你所料，海淀区上空的量子扰动指数超标了整整三倍。"
            },
            {
                id: 2,
                speaker: "陈梓彤",
                rightSprite: "images/char_chen.png",
                rightStatus: "focus",
                leftStatus: "blur",
                text: "意料之中。看来‘那个计划’已经启动了。留给我们的时间不多了，子傲。"
            },
            {
                id: 3,
                speaker: "贾子傲",
                leftStatus: "focus",
                rightStatus: "blur",
                text: "核心协议还在我们手里，只要能在防御网崩溃前完成逆向重构……等等，警报响了！",
                weather: "weather-glitch",
                sfx: "audio/sfx_shatter.mp3"
            },
            {
                id: 4,
                speaker: "系统提示",
                text: "警告：未知协议正在强行接入，请立刻做出抉择。",
                weather: "weather-rain",
                branches: [
                    { text: "执行‘强行切断’底层协议", nextId: 5 },
                    { text: "尝试‘全面追踪’对方信号", nextId: 8 }
                ]
            },
            // 分支 A 路线
            {
                id: 5,
                speaker: "贾子傲",
                leftStatus: "focus",
                rightStatus: "blur",
                text: "来不及想了，必须强行熔断链路！陈梓彤，帮我稳住主控台核心电压！"
            },
            {
                id: 6,
                speaker: "陈梓彤",
                leftStatus: "blur",
                rightStatus: "focus",
                text: "明白，隔离墙已全功率同步升起。顶住这一波，我们还有胜算！"
            },
            {
                id: 7,
                speaker: "系统提示",
                text: "链路已成功熔断，警报暂时解除。危机似乎勉强挺过去了…… 【分支A完】",
                weather: "weather-sunset",
                isEnd: true
            },
            // 分支 B 路线
            {
                id: 8,
                speaker: "陈梓彤",
                leftStatus: "blur",
                rightStatus: "focus",
                text: "别切断！这或许是抓到他们幕后主脑的唯一机会。把防火墙全放开，顺着链路咬过去！"
            },
            {
                id: 9,
                speaker: "贾子傲",
                leftStatus: "focus",
                rightStatus: "blur",
                text: "这太冒险了……好吧，听你的！量子探针已全力发射，正在强行逆向破解入侵者坐标！"
            },
            {
                id: 10,
                speaker: "系统提示",
                text: "核心数据捕获成功，屏幕上弹出了一个神秘的西二旗坐标……博弈才刚刚拉开序幕。 【分支B完】",
                weather: "weather-normal",
                isEnd: true
            }
        ];

        // 状态变量
        let currentIndex = 0;
        let bgmAudio = null;
        let sfxAudio = null;

        // DOM 节点
        const mainMenu = document.getElementById('main-menu');
        const startBtn = document.getElementById('start-btn');
        const bgNode = document.getElementById('scene-background');
        const spriteLeft = document.getElementById('sprite-left');
        const spriteRight = document.getElementById('sprite-right');
        const speakerName = document.getElementById('speaker-name');
        const dialogueText = document.getElementById('dialogue-text');
        const dialogueBox = document.getElementById('dialogue-box');
        const branchContainer = document.getElementById('branch-container');

        // 开始按钮点击事件
        startBtn.addEventListener('click', () => {
            mainMenu.style.display = 'none';
            renderStep(0);
        });

        // 对话框点击继续事件
        dialogueBox.addEventListener('click', () => {
            const currentStep = gameScript[currentIndex];
            if (currentStep.branches && currentStep.branches.length > 0) return;
            if (currentStep.isEnd) {
                alert("感谢游玩《海淀博弈》原型版本！游戏将回到首页。");
                currentIndex = 0;
                if (bgmAudio) bgmAudio.pause();
                mainMenu.style.display = 'flex';
                return;
            }
            currentIndex++;
            if (currentIndex < gameScript.length) {
                renderStep(currentIndex);
            }
        });

        // 渲染单步剧情逻辑
        function renderStep(index) {
            currentIndex = index;
            const step = gameScript[index];

            // 1. 刷新背景与天气特效
            if (step.bg) bgNode.style.backgroundImage = `url('${step.bg}')`;
            if (step.weather) {
                bgNode.className = ''; 
                bgNode.classList.add(step.weather);
            }

            // 2. 刷新声音逻辑
            if (step.bgm) {
                if (bgmAudio) bgmAudio.pause();
                bgmAudio = new Audio(step.bgm);
                bgmAudio.loop = true;
                bgmAudio.play().catch(e => console.log("等待用户交互后播放音乐"));
            }
            if (step.sfx) {
                if (sfxAudio) sfxAudio.pause();
                sfxAudio = new Audio(step.sfx);
                sfxAudio.play();
            }

            // 3. 刷新立绘及其焦点形态
            if (step.leftSprite) {
                spriteLeft.src = step.leftSprite;
                spriteLeft.classList.add('active');
            }
            if (step.rightSprite) {
                spriteRight.src = step.rightSprite;
                spriteRight.classList.add('active');
            }

            // 立绘明暗对焦优化
            spriteLeft.className = 'character-sprite' + (spriteLeft.src ? ' active' : '') + (step.leftStatus ? ' ' + step.leftStatus : '');
            spriteRight.className = 'character-sprite' + (spriteRight.src ? ' active' : '') + (step.rightStatus ? ' ' + step.rightStatus : '');

            // 4. 刷新对话文本
            speakerName.textContent = step.speaker;
            dialogueText.textContent = step.text;

            // 5. 刷新分支选项按钮
            if (step.branches && step.branches.length > 0) {
                branchContainer.innerHTML = '';
                branchContainer.style.display = 'flex';
                step.branches.forEach(b => {
                    const btn = document.createElement('div');
                    btn.className = 'branch-button';
                    btn.textContent = b.text;
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        branchContainer.style.display = 'none';
                        renderStep(b.nextId);
                    });
                    branchContainer.appendChild(btn);
                });
            } else {
                branchContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
